<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Building cool stuff" />
    <meta name="keywords" content="web developer, software developer, zmra.dev" />

    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/images/logo_svg.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="index, follow" />

    <title>Cesar Zamora - zmra.dev</title>

    <!-- Global, page-independent OG/Twitter meta. og:type, og:title, og:description,
         og:image, og:url and the twitter:* equivalents are set per-page in each
         route's <svelte:head> — do not duplicate them here, since duplicate
         properties produce unpredictable results in social-media scrapers. -->
    <meta property="og:site_name" content="Cesar Zamora" />
    <meta name="author" content="zmra.dev" />
    <meta name="twitter:creator" content="heyzamora__" />

    %sveltekit.head%
  </head>
  <body
    data-sveltekit-preload-data="hover"
    class="min-h-dvh scroll-smooth bg-neutral-100 font-sans antialiased selection:bg-neutral-200 dark:bg-neutral-900 dark:selection:bg-neutral-700"
  >
    %sveltekit.body%
  </body>
</html>
